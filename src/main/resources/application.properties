spring.datasource.url=jdbc:postgresql://ep-purple-band-a1kp70rs-pooler.ap-southeast-1.aws.neon.tech/sqlfirstone?sslmode=require
#sqlfirstone is the db
server.port=${PORT:8080}
 # If PORT is provided, Spring uses it Otherwise, it defaults to 8080.
server.instance=${INSTANCE_NAME:Instance-1}
# Each Spring Boot instance will later get its own name:
spring.datasource.username=${NEON_OWNER}
spring.datasource.password=${NEON_PASSWORD}
spring.datasource.hikari.data-source-properties.ssl=true
spring.datasource.hikari.data-source-properties.sslmode=require
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
SECRET_KEY = ${SECRET_KEY}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_SECRET}
spring.security.oauth2.client.registration.github.scope=user:email
SITE_KEY=${SITE_KEY}
RECAPTCHA_SECRET=${RECAPTCHA_SECRET}
server.forward-headers-strategy=framework
#use this one when load balancer is used and oauth . Don't trust the internal connection details. Use the forwarded headers sent by the reverse proxy (here the nginx config)
